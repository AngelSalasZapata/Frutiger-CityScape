name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (por ejemplo v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que el tag coincida con package.json
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}".TrimStart('v')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "El tag '$tag' no coincide con la version '$version' de package.json."
          }

      - name: Formato, lint y pruebas
        run: |
          npm run format:check
          npm run lint
          npm run test

      - name: Empaquetar instalador NSIS
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Calcular checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content release/SHA256SUMS.txt

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Frutiger Cityscape ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
